name: estefanyy-ci-cd

on:
  push:
    branches:
      - estefany

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Login en DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir imagen Docker
      run: docker build -t estefany:1.0.0 .

    - name: Etiquetar imagen para DockerHub
      run: docker tag estefany:1.0.0 ${{ secrets.DOCKERHUB_USERNAME }}/estefany:1.0.0

    - name: Subir imagen a DockerHub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/estefany:1.0.0
